name: Deploy to WordPress.org
on:
  release:
    types: [published]
jobs:
  tag:
    name: New release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # the notice-center submodule must ship, or wp-admin has no Notice Center
        submodules: recursive
    - name: Set Notice Center text domain
      # the shared submodule uses a generic text domain; wp.org requires the plugin slug
      run: |
        sed -i -E "s/, '(wpzoom-notice-center|instagram-widget-by-wpzoom)' \)/, 'wpzoom-forms' )/g" classes/notice-center/notice-center.php
        if grep -nE "'(wpzoom-notice-center|instagram-widget-by-wpzoom)' \)" classes/notice-center/notice-center.php; then
          echo "::error::Notice Center still has a foreign text domain"; exit 1
        fi
    - name: WordPress Plugin Deploy
      id: deploy
      uses: 10up/action-wordpress-plugin-deploy@stable
      with:
        generate-zip: false
      env:
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SLUG: wpzoom-forms
